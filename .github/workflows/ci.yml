name: ci

on:
  push:
    branches:
      - main
      - master
      - irlume-patches
  pull_request:
    branches:
      - master
      - irlume-patches
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: test-and-lint (rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly]
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Build all targets
        run: cargo build --all-targets --locked

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Run full test suite
        run: cargo test --all-targets --locked

      - name: Lint
        if: matrix.rust == 'stable'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings -A clippy::incompatible-msrv

      - name: Build PAM test fixture module
        run: cargo build --example test_module --features libpam --locked

      - name: Verify PAM entrypoint symbol exports
        run: bash tests/symbols.sh

      - name: Install optional PAM wrapper test dependencies
        continue-on-error: true
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libpam-wrapper pamtester || true
          else
            echo "apt-get not available; skipping optional PAM wrapper test dependencies"
          fi

      - name: Run PAM wrapper integration compile/tests
        run: cargo test --test pamwrap -- --include-ignored --test-threads=1
