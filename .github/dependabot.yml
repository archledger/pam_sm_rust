# Dependabot keeps Cargo dependencies and pinned Actions current.
# Every update must pass the complete required-check set; automerge is
# disabled at this authentication boundary. A seven-day cooldown avoids
# pulling freshly published (potentially compromised) versions.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    target-branch: irlume-patches
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    target-branch: irlume-patches
