# cargo-deny policy for the pamsm fork.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"

[licenses]
version = 2
# Upstream is GPL-3.0-only; the fork preserves it without relicensing.
allow = ["GPL-3.0-only", "MIT", "Apache-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
